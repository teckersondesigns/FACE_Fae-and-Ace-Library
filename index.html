<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storybook</title>
<style>
/* ===== HOW TO USE =====
 Each book = a folder:  books/NAME/book.json + page images.
 Open the reader with:  index.html?book=NAME
 book.json example:
 { "title": "My Bear Book",
   "pages": ["1.jpg","2.jpg","3.jpg"],
   "audio": ["1.mp3","2.mp3","3.mp3"] }   <- audio is optional
 book.json is optional: if it is empty or has no "pages", the reader
 automatically uses 1.jpg, 2.jpg, 3.jpg ... in the same folder.
 File names are case-sensitive on GitHub Pages (1.jpg is not 1.JPG).
 With no ?book= the demo book below is shown. */
html,body{margin:0;height:100%;background:#fff7e6;font-family:Arial,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
#page{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  background:#fff;object-fit:contain;pointer-events:none}
#msg{text-align:center;color:#a67c00;font-size:clamp(22px,5vw,36px);padding:20px}
#msg small{display:block;margin-top:12px;font-size:clamp(14px,3vw,20px);opacity:.8}
#bar{display:flex;gap:12px;justify-content:center;align-items:center;padding:10px}
button{border:0;border-radius:50px;font-size:clamp(20px,5vw,34px);font-weight:bold;color:#fff;
  min-width:clamp(90px,22vw,170px);height:clamp(60px,14vw,90px);cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#back{background:#4a90e2}#next{background:#43b649}#again{background:#f5a623}#sound{background:#9b59b6;min-width:clamp(60px,14vw,90px)}
button[hidden],#msg[hidden],#page[hidden],#bar[hidden]{display:none}
#dots{font-size:18px;color:#a67c00;min-width:60px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <img id="page" alt="Book page" draggable="false">
    <div id="msg" hidden></div>
  </div>
  <div id="bar">
    <button id="back" aria-label="Back">◀</button>
    <button id="sound" aria-label="Play sound" hidden>🔊</button>
    <span id="dots"></span>
    <button id="again" hidden>↺ Again</button>
    <button id="next" aria-label="Next">▶</button>
  </div>
</div>
<audio id="audio"></audio>
<script>
// Demo book (colored pages) used when no ?book= is given
function demoPage(n,color,text){
  const s='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="'+color+'"/><text x="400" y="330" font-size="120" text-anchor="middle" font-family="Arial" fill="#fff">'+text+'</text></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}
const DEMO={title:"Demo",base:"",audio:[],
  pages:[demoPage(1,"#e74c3c","Page 1"),demoPage(2,"#3498db","Page 2"),demoPage(3,"#2ecc71","Page 3"),demoPage(4,"#f39c12","The End")]};

const $=id=>document.getElementById(id);
const img=$("page"),back=$("back"),next=$("next"),again=$("again"),sound=$("sound"),dots=$("dots"),audio=$("audio"),msg=$("msg"),bar=$("bar");
let book=null,i=0;

function fail(text,detail){
  book=null;
  audio.pause();
  img.hidden=true;
  bar.hidden=true;
  msg.hidden=false;
  msg.textContent=text;
  if(detail){const s=document.createElement("small");s.textContent=detail;msg.appendChild(s);}
}

function show(){
  if(!book)return;
  img.hidden=false;
  img.onerror=()=>fail("A page picture is missing","Could not load: "+book.pages[i]+" (check the file name and capital letters)");
  img.src=book.base+book.pages[i];
  const last=i===book.pages.length-1;
  back.style.visibility=i===0?"hidden":"visible";
  next.hidden=last; again.hidden=!last;
  dots.textContent=(i+1)+" / "+book.pages.length;
  audio.pause();
  const a=book.audio&&book.audio[i];
  sound.hidden=!a;
  if(a){audio.src=book.base+a;audio.play().catch(()=>{});}
  // preload next page
  if(!last){const p=new Image();p.src=book.base+book.pages[i+1];}
}
function go(d){
  if(!book)return;
  const n=i+d;
  if(n>=0&&n<book.pages.length){i=n;show();}
}
next.onclick=()=>go(1);
back.onclick=()=>go(-1);
again.onclick=()=>{if(book){i=0;show();}};
sound.onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{});};

// Swipe support
let x0=null;
document.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
document.addEventListener("touchend",e=>{
  if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>50)go(dx<0?1:-1);
});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
// Block right-click / links so kids stay on the page
document.addEventListener("contextmenu",e=>e.preventDefault());

const name=new URLSearchParams(location.search).get("book");
if(name===null){
  book=DEMO;show();
}else if(!/^[\w \-]+$/.test(name)){
  fail("Book not found","Book names can only use letters, numbers, spaces, - and _");
}else{
  const base="books/"+encodeURIComponent(name)+"/";

  // Checks whether an image file exists
  const exists=src=>new Promise(res=>{const t=new Image();t.onload=()=>res(true);t.onerror=()=>res(false);t.src=src;});

  // Finds 1.jpg, 2.jpg, 3.jpg ... until one is missing (also tries png/jpeg/webp)
  // Also handles 01.jpg / 001.jpg style names and books that start at 0
  async function detectPages(){
    const pad=(n,w)=>String(n).padStart(w,"0");
    for(const ext of ["jpg","png","jpeg","webp","JPG","PNG","JPEG"]){
      for(const w of [1,2,3]){
        for(const start of [1,0]){
          if(!(await exists(base+pad(start,w)+"."+ext)))continue;
          const pages=[pad(start,w)+"."+ext];
          for(let n=start+1;n<=300;n++){
            const f=pad(n,w)+"."+ext;
            if(await exists(base+f))pages.push(f);else break;
          }
          return pages;
        }
      }
    }
    return [];
  }

  (async()=>{
    let b=null;
    try{
      const r=await fetch(base+"book.json");
      if(r.ok)b=await r.json();
    }catch(e){/* empty or invalid book.json: fall back to auto-detect */}

    let pages=b&&Array.isArray(b.pages)&&b.pages.length?b.pages:await detectPages();
    if(!pages.length){
      fail("Book not found","No pages found in books/"+name+"/ (look for 1.jpg, 2.jpg, 3.jpg ... and check capital letters)");
      return;
    }
    book={title:(b&&b.title)||name,pages:pages,audio:(b&&b.audio)||[],base:base};
    document.title=book.title;
    show();
  })();
}
</script>
</body>
</html>
